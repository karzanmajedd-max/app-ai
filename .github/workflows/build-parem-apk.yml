name: Build Parem Offline APK
on:
  push:
    branches: [parem-android-apk]
    paths:
      - 'parem-android/**'
      - '.github/workflows/build-parem-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          yes | sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' || true
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate offline web app
        run: |
          node --check parem-android/app/src/main/assets/app.js
          grep -q 'پارەم' parem-android/app/src/main/assets/index.html
          grep -q 'receiveBackup' parem-android/app/src/main/assets/app.js
      - name: Build Android debug APK
        working-directory: parem-android
        run: gradle --no-daemon assembleDebug
      - name: Verify APK exists
        shell: bash
        run: |
          test -s parem-android/app/build/outputs/apk/debug/app-debug.apk
          cp parem-android/app/build/outputs/apk/debug/app-debug.apk Parem_Finance_2_Offline.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Parem-Finance-2-APK
          path: Parem_Finance_2_Offline.apk
          retention-days: 30
