name: Build Easy English APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'easy-english/**'
      - '.github/workflows/build-easy-english.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' || true
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify JavaScript syntax and required Easy English screens
        shell: bash
        run: |
          node --check easy-english/app/src/main/assets/improve-v5.js
          node easy-english/tests/gemini.test.cjs
          python3 - <<'PY'
          from pathlib import Path
          root=Path('easy-english/app/src/main/assets')
          html=(root/'index.html').read_text()
          js=(root/'improve-v5.js').read_text()
          css=(root/'improve-v5.css').read_text()
          assert 'improve-v5.js' in html and 'improve-v5.css' in html
          assert 'data-action="ai5-mic"' in js
          assert 'gemini-remember' in js and 'testAiConnection=async' in js
          assert 'ee5-setup' in js and '.quiz-box .question' in css
          assert 'const LEVELS=' in html and 'function settings()' in html
          print('Easy English V5 source checks passed')
          PY
      - name: Build APK
        working-directory: easy-english
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: EasyEnglish-Android-APK
          path: easy-english/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish olive APK to GitHub Releases
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release-olive]')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="easyenglish-olive-fixed-v5"
          cp easy-english/app/build/outputs/apk/debug/app-debug.apk EasyEnglish_Olive_Fixed_v5.apk
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" EasyEnglish_Olive_Fixed_v5.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" EasyEnglish_Olive_Fixed_v5.apk --repo "$GITHUB_REPOSITORY" --target main --title "Easy English 5.0 - Olive Cream Fixes" --notes "GitHub-built debug APK V5: high-contrast olive/cream styling, Gemini first-run verification and hidden normal API setup, corrected Gemini native callback, and microphone support with fallback. Lightweight build: Android TTS voice availability and AI voice recognition depend on device. Install and verify on your phone." --latest=false
          fi

      - name: Publish API recovery APK
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release-api]')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="easyenglish-api-fixed-v55"
          cp easy-english/app/build/outputs/apk/debug/app-debug.apk EasyEnglish_API_Fixed_v5.5.apk
          gh release create "$TAG" EasyEnglish_API_Fixed_v5.5.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Easy English 5.5 - Teacher response and connection improvements" --notes "Shorter teacher responses and history; Flash-Lite default; manual retry; readable DNS and timeout errors; speech service disconnect fallback; static chat header. Android system/IME insets resize the WebView container and are consumed to avoid double padding. Visual viewport resizing keeps the composer visible. Physical keyboard validation still required. Regression checks and Android build run in CI. Device connection with your own key still needs verification. Separate app ID allows installation alongside older versions without removing its data; enter your key again in 5.5. Debug test APK." --latest=false
