name: Build Zikrakan v2.1 APK
on:
  push:
    branches: [build-zikrakan-v2-1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Compile Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' || true
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Zikrakan project
        run: |
          unzip -q zikrakan/Zikrakan-v2.1-Android-Source.zip
          sed -i 's/versionCode = 3/versionCode = 5/' Zikrakan/app/build.gradle.kts
      - name: Build APK
        working-directory: Zikrakan
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload installable APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zikrakan-v2.1-APK
          path: Zikrakan/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
