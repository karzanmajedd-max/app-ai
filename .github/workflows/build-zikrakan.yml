name: Build Zikrakan Android APK v4
on:
  push:
    paths:
      - 'zikrakan/**'
      - '.github/workflows/build-zikrakan.yml'
  workflow_dispatch:
jobs:
  android:
    name: Compile tested APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Confirm Android SDK
        shell: bash
        run: |
          yes | sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' || true
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack original Zikrakan Android project
        run: unzip -q zikrakan/Zikrakan-Android-Project.zip -d zikrakan/build-source
      - name: Apply Zikrakan v3 fixes
        shell: bash
        run: |
          base64 -d zikrakan/v3-fix.tar.gz.b64 | tar -xzf - -C zikrakan/build-source/Zikrakan
          test -f zikrakan/build-source/Zikrakan/app/src/main/java/com/zikr/zikrakan/DismissReceiver.kt
          sed -i 's/setBackgroundColor(background)/setBackgroundColor(0xFF061410.toInt())/g' zikrakan/build-source/Zikrakan/app/src/main/java/com/zikr/zikrakan/MainActivity.kt
      - name: Fix delivery when Zikrakan is closed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("zikrakan/build-source/Zikrakan/app/src/main/java/com/zikr/zikrakan")
          p = root / "Notifier.kt"
          s = p.read_text(encoding="utf-8")
          old = "        ensureChannels(app)\n\n        val power ="
          new = "        ensureChannels(app)\n        // Always publish the notification before an overlay attempt.\n        // Alarm receivers can be stopped after onReceive returns.\n        post(app, channelId(p.sound, p.vibrate), d)\n\n        val power ="
          assert old in s, "Expected v3 Notifier layout not found"
          s = s.replace(old, new, 1)
          old = "                    post(app, QUIET_CH, d)\n                    alert(app, p)"
          assert old in s, "Expected previous overlay callback not found"
          s = s.replace(old, "                    // Already delivered a high-priority notification above.", 1)
          old = "                onFail = { post(app, channelId(p.sound, p.vibrate), d) },"
          assert old in s, "Expected onFail callback not found"
          s = s.replace(old, "                onFail = { /* The notification remains visible. */ },", 1)
          old = "            post(app, channelId(p.sound, p.vibrate), d)\n        }\n    }\n}"
          assert old in s, "Expected non-overlay fallback not found"
          s = s.replace(old, "            // Notification was posted synchronously before the overlay branch.\n        }\n    }\n}", 1)
          p.write_text(s, encoding="utf-8")
          r = root / "AlarmReceiver.kt"
          t = r.read_text(encoding="utf-8")
          old = "        if (p.enabled) Notifier.show(context, p)\n        Scheduler.schedule(context) // کاتی دواتر ڕێکبخە"
          assert old in t, "Expected alarm receiver layout not found"
          new = "        try {\n            if (p.enabled) Notifier.show(context, p)\n        } catch (_: Exception) {\n            // Keep future reminders even if the OEM rejects this alert.\n        } finally {\n            Scheduler.schedule(context)\n        }"
          t = t.replace(old, new, 1)
          r.write_text(t, encoding="utf-8")
          print("Background notification fix applied")
          PY
          grep -q 'Always publish the notification before an overlay' zikrakan/build-source/Zikrakan/app/src/main/java/com/zikr/zikrakan/Notifier.kt
      - name: Build debug APK
        working-directory: zikrakan/build-source/Zikrakan
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Confirm APK generated
        run: |
          ls -lh zikrakan/build-source/Zikrakan/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: Zikrakan-v4-APK
          path: zikrakan/build-source/Zikrakan/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
