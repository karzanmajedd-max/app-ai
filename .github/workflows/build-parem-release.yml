name: Prepare Parem Android Release
on:
  push:
    branches: [parem-android-apk]
    paths:
      - 'parem-android/**'
      - '.github/workflows/build-parem-release.yml'
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          yes | sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' || true
          test -f "$ANDROID_HOME/build-tools/35.0.0/zipalign"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate app
        shell: bash
        run: |
          node --check parem-android/app/src/main/assets/app.js
          grep -q 'POST_NOTIFICATIONS' parem-android/app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.INTERNET' parem-android/app/src/main/AndroidManifest.xml
          grep -q 'OPEN_EXPENSE' parem-android/app/src/main/java/com/parem/finance/MainActivity.java || grep -q 'paremOpenExpense' parem-android/app/src/main/java/com/parem/finance/MainActivity.java
      - name: Compile production release (unsigned)
        working-directory: parem-android
        run: gradle --no-daemon assembleRelease
      - name: Align and validate release archive
        shell: bash
        run: |
          set -euo pipefail
          source="parem-android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$source"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$source" Parem_2_2_release_aligned_unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 Parem_2_2_release_aligned_unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Parem_2_2_release_aligned_unsigned.apk | grep -E '^package:|^sdkVersion:|^targetSdkVersion:'
      - uses: actions/upload-artifact@v4
        with:
          name: Parem-2-2-Unsigned-Release
          path: Parem_2_2_release_aligned_unsigned.apk
          retention-days: 7
