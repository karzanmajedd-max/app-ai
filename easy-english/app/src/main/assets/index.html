/* Easy English AI tutor UI, requires a separately deployed HTTPS API */
.ai-chat{display:grid;gap:12px;min-height:210px;max-height:52vh;overflow:auto;padding:4px 1px}
.ai-bubble{border-radius:16px;padding:13px 14px;line-height:1.9;overflow-wrap:anywhere;white-space:pre-wrap;background:#1a3043;border:1px solid #355467}
.ai-bubble.user{background:#173d41;border-color:#28695d;margin-right:12%;}
.ai-bubble.teacher{margin-left:12%;}
.ai-title{font-size:11px;color:var(--gold);font-weight:800;padding-bottom:6px}
.ai-stack{display:grid;gap:10px}
.ai-input{width:100%;min-height:60px;resize:vertical;border-radius:12px;padding:12px;color:#eef8fb;background:#0f1e30;border:1px solid #3a5c6c;direction:ltr;text-align:left;font-size:16px}
.ai-control{width:100%;min-height:44px;border:1px solid #385568;border-radius:12px;background:#0f1e30;color:white;padding:8px 12px;direction:ltr;text-align:left}
.ai-tag{display:inline-flex;align-items:center;gap:5px;border:1px solid #7b6843;color:#edd5a8;border-radius:99px;padding:4px 9px;font-size:11px}
.ai-note{color:#afc3cf;font-size:12px;line-height:2}
.ai-sample{display:flex;flex-wrap:wrap;gap:7px}
.ai-sample button{border:1px solid #3e6273;border-radius:99px;color:#eaf3f5;background:#182c3e;padding:7px 10px;font-size:12px}

function wordList(items){const lower=wordFilter.trim().toLocaleLowerCase();const a=items.filter(x=>!lower||x.en.toLowerCase().includes(lower)||x.ku.includes(wordFilter));return a.length?a.map(it=>`<div class="word"><div class="content"><span class="english">${esc(it.en)}</span><span class="kurdish">${esc(it.ku)}</span></div><button class="sound" data-action="speak" data-text="${esc(itemSound(it))}" aria-label="گوێگرتن">♫</button></div>`).join(''):'<div class="empty">هیچ وشەیەک نەدۆزرایەوە</div>'}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function question(it,n){if(n===1){const isUpper=Math.random()<.5;const answer=isUpper?it.en:it.en.toLowerCase();const opts=shuffle([answer,...shuffle(level(1).items.filter(y=>y.en!==it.en)).slice(0,3).map(y=>isUpper?y.en:y.en.toLowerCase())]);return {text:isUpper?'پیتی گەورەی ئەم پیتە کامەیە؟':'پیتی بچووکەکە کامەیە؟',prompt:isUpper?it.en.toLowerCase():it.en,options:opts,correct:answer,key:it.en,n:1}}const all=level(n).items;
 const pool=[...new Set(all.filter(y=>y.ku!==it.ku).map(y=>y.ku))];const opts=shuffle([it.ku,...shuffle(pool).slice(0,3)]);return {text:'مانای ئەم وشەیە بە کوردی چییە؟',prompt:it.en,options:opts,correct:it.ku,key:it.en,n,listen:Math.random()<.38}

function buildQuiz(mode){let items=[],cap=mode==='gate'?5:mode==='practice'?8:(activeLevel===1?26:activeLevel%5===0?14:10);
if(mode==='gate'){const prior=LEVELS.slice(0,activeLevel-1),bad=[];for(const l of prior)for(const x of l.items)if((state.mistakes[l.number]||[]).includes(x.en))bad.push({it:x,n:l.number});const used=new Set();for(const x of shuffle(bad)){const k=x.n+':'+x.it.en;if(!used.has(k)){items.push(x);used.add(k)}if(items.length>=3)break}for(const l of prior.slice().reverse())for(const it of shuffle(l.items)){const k=l.number+':'+it.en;if(!used.has(k)){items.push({it,n:l.number});used.add(k)}if(items.length>=cap)break}}else{items=shuffle(level(activeLevel).items).map(it=>({it,n:activeLevel}));if(mode==='test'&&activeLevel%5===0){const older=[];for(const l of LEVELS.slice(0,activeLevel-1))for(const it of shuffle(l.items).slice(0,2))older.push({it,n:l.number});items=shuffle([...items.slice(0,10),...shuffle(older).slice(0,4)])}}items=items.slice(0,cap);quiz={mode,questions:items.map(({it,n})=>question(it,n)),pos:0,correct:0,missed:[],selected:null,complete:false};page='quiz';render(true)}
function answer(v){if(!quiz||quiz.complete||quiz.selected!==null)return;const q=quiz.questions[quiz.pos];quiz.selected=v;const yes=v===q.correct;if(yes)quiz.correct++;else quiz.missed.push({n:q.n,key:q.key,correct:q.correct,chosen:v,prompt:q.prompt});render(false);if(!yes)speak(q.prompt)}
function quizNext(){if(!quiz||quiz.selected===null)return;if(quiz.pos===quiz.questions.length-1){finishQuiz();return}quiz.pos++;quiz.selected=null;render(false)}
function finishQuiz(){quiz.complete=true;const pct=Math.round(100*quiz.correct/quiz.questions.length),mode=quiz.mode;

 for(const q of quiz.questions){const failed=quiz.missed.some(x=>x.n===q.n&&x.key===q.key);const a=new Set(state.mistakes[q.n]||[]);if(failed)a.add(q.key);else a.delete(q.key);state.mistakes[q.n]=[...a]}
 if(mode==='test'&&pct>=80){const old=state.completed[activeLevel];state.completed[activeLevel]={score:Math.max(old?.score||0,pct),date:new Date().toISOString().slice(0,10)};const dt=new Date().toISOString().slice(0,10);if(!state.sessionDates.includes(dt))state.sessionDates.push(dt)}
 if(mode==='gate'&&pct>=80)state.reviewDone[activeLevel]=true;
 save();render(false)
}

function removeGeminiKey(){geminiApiKey='';if(nativeGeminiAvailable())try{Android.clearGeminiKey()}catch(e){};aiReady=false;aiStatus='کلیلی API لەم ئامێرە سڕایەوە.';try{localStorage.removeItem(GEMINI_STORED_KEY)}catch(e){}render();toast(aiStatus)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-ai-example]');if(b){let input=document.getElementById('ai-question');if(input){input.value=b.dataset.aiExample;input.focus()}}});

function render(scroll=false){header();nav();document.getElementById('main').innerHTML=({home,levels:allLevels,lesson:levelPage,quiz:quizPage,review,ai:aiPage,settings}[page]||home)();if(scroll)window.scrollTo(0,0)}
function openLevel(n){if(!canEnter(n)){toast('سەرەتا لیڤلی پێشوو تەواو بکە');return}activeLevel=n;wordFilter='';page='lesson';render(true)}
document.addEventListener('click',function(e){const pageEl=e.target.closest('[data-page]');if(pageEl){stopSpeech();page=pageEl.dataset.page;if(page==='ai')aiLessonContext=null;render(true);return}const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;switch(a){case 'ai-for-lesson':aiLessonContext=Number(el.dataset.level)||activeLevel;page='ai';render(true);break;case 'back-to-lesson':activeLevel=aiLessonContext||activeLevel;page='lesson';render(true);break;case 'enter':openLevel(Number(el.dataset.level));break;case 'speak':speak(el.dataset.text);break;case 'pronounce':startSpeakingPractice(el.dataset.text);break;case 'assess-voice':scoreSpokenAnswer(document.getElementById('voice-transcript-input')?.value||'');break;case 'repeat-voice':speak(el.dataset.text);break;case 'ai-send':sendAiMessage();break;case 'ai-clear':aiMessages=[];try{sessionStorage.removeItem('easy_ai_chat')}catch(e){}render();break;case 'ai-speak':speak(el.dataset.text);break;case 'ai-save':saveAiConfig();break;case 'ai-check':testAiConnection();break;case 'ai-remove-key':removeGeminiKey();break;case 'teacher-check':speak('Hello. My name is your English teacher. A. B. C. One. Two. Three.');break;case 'quiz':buildQuiz(el.dataset.mode);break;case 'answer':answer(el.dataset.answer);break;case 'quiz-next':quizNext();break;case 'retry':buildQuiz(quiz.mode);break;case 'back-level':page='lesson';render(true);break;case 'afterpass':if(quiz.mode==='gate'){page='lesson';render(true)}else if(quiz.mode==='test'&&state.completed[activeLevel]&&activeLevel<30)openLevel(activeLevel+1);else{page='levels';render(true)}break;case 'weekly':weeklyPractice();break;case 'review-practice':mistakePractice();break;case 'reset-confirm':if(confirm('دڵنیایت دەتەوێت هەموو پێشکەوتنەکان بسڕیتەوە؟')){state.completed={};state.mistakes={};state.reviewDone={};state.sessions=0;state.sessionDates=[];save();page='home';render(true)}break;}});
document.addEventListener('keydown',function(e){if(e.target.id==='ai-question'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendAiMessage()}});
document.addEventListener('input',function(e){if(e.target.id==='voice-transcript-input'&&e.target.value.trim()){scoreSpokenAnswer(e.target.value)}if(e.target.id==='wordsearch'){wordFilter=e.target.value;const current=level(activeLevel);const list=document.getElementById('word-list');if(list)list.innerHTML=wordList(current.items)} });
document.addEventListener('change',function(e){const s=state.settings;if(e.target.id==='rate'){s.rate=Number(e.target.value);save();toast('خێرایی دەنگ گۆڕدرا')}else if(e.target.id==='gender'){s.gender=e.target.value;save();toast('جۆری دەنگ هەڵبژێردرا')}else if(e.target.id==='reminders'||e.target.id==='time'){s.reminders=document.getElementById('reminders')?.checked??s.reminders;s.time=document.getElementById('time')?.value||s.time;save();reminder();toast('ڕێکخستنەکانی بیرخستنەوە پاشەکەوت کران')}});
window.addEventListener('load',()=>{if(state.settings.reminders)reminder();});
render(true);
</script>
</body>
</html>
